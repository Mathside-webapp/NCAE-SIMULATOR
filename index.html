<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#092449">
  <meta name="description" content="Unofficial, offline-friendly Part V NCAE classroom training simulator with 20 original practice questions.">
  <title>NCAE Practice | Part V • Unofficial Simulation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"></div>
  <div id="modal-root"></div>

  <!-- Persist across *all* views; the app renderer replaces only #app. -->
  <button id="kb-launcher" type="button" aria-label="Open keyboard trainer" aria-controls="kb-popover" aria-expanded="false">
    <span class="kb-launcher-icon" aria-hidden="true">⌨</span>
  </button>
  <aside id="kb-popover" role="dialog" aria-label="Movable keyboard trainer" aria-modal="false" hidden>
    <div class="kb-titlebar" id="kb-titlebar" aria-label="Drag this bar to move the keyboard">
      <div class="kb-title"><span aria-hidden="true">⌨</span><span>Keyboard Practice<small>Drag the blue bar to move • Resize from lower-right corner</small></span></div>
      <button type="button" class="kb-close" id="kb-close" title="Close keyboard" aria-label="Close keyboard trainer">×</button>
    </div>
    <p class="kb-hint" id="kb-hint" role="status">Press a key on your <strong>physical keyboard</strong> to highlight it. You can also click these keys to type in a selected field.</p>
    <div class="kb-viewport"><div class="kb-board" id="kb-board"></div><div class="kb-resize-note">↘ Drag the bottom-right corner to resize</div></div>
    <div class="kb-bottom-actions"><span id="kb-status" aria-live="polite">Select the username or password box, then practice.</span><button type="button" id="kb-reset">Reset position</button></div>
  </aside>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>  <script src="script.js"></script>

</body>
</html>
